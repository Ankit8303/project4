[project]
name = "clauseiq"
version = "0.1.0"
description = "Multi-agent AI for Indian contract analysis with an MCP server."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "structlog>=24.1",
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.2,<0.3",
    "chromadb>=0.5,<0.6",
    "sentence-transformers>=3.0",
    "torch>=2.2",
    "rank-bm25>=0.2.2",
    "pymupdf>=1.24",
    "httpx>=0.27",
    "google-genai>=0.3",
    "mcp>=1.0",
    "langfuse>=2.0,<3.0",
    "numpy>=1.26",
]

[project.scripts]
clauseiq-ingest-laws = "clauseiq.infrastructure.ingestion.law_ingestor:main"
clauseiq-mcp = "clauseiq.interfaces.mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6,<0.7",
    "mypy>=1.11,<1.12",
    "pre-commit>=3.7",
    "respx>=0.21",
    "types-requests",
]
eval = ["deepeval>=1.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clauseiq"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "ASYNC", "PTH", "RUF", "N"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N806"]

[tool.ruff.lint.isort]
known-first-party = ["clauseiq"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "chromadb.*", "sentence_transformers.*", "rank_bm25.*", "transformers.*",
    "fitz", "fitz.*", "langgraph.*", "langchain_core.*", "google.genai.*",
    "mcp.*", "langfuse.*", "deepeval.*", "unstructured.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "integration: tests that touch real infrastructure (ChromaDB, models)",
    "evaluation: full LLM-as-judge eval suite",
]

[tool.coverage.run]
source = ["src/clauseiq"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

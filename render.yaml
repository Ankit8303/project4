services:
  - type: web
    name: clauseiq-api
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: CLAUSEIQ_ENVIRONMENT
        value: prod
      - key: CLAUSEIQ_LOG_LEVEL
        value: INFO
      - key: CLAUSEIQ_LOG_JSON
        value: "true"
      - key: CLAUSEIQ_CHROMA_PERSIST_DIR
        value: data/chroma
      - key: CLAUSEIQ_CHROMA_MODE
        value: embedded
      - key: CLAUSEIQ_ORCHESTRATION_MODEL
        value: gemini-3.5-flash-lite
      - key: CLAUSEIQ_ANALYSIS_MODEL
        value: gemini-3.5-flash-lite
      - key: CLAUSEIQ_GEMINI_API_KEY
        sync: false
      - key: CLAUSEIQ_CORS_ALLOWED_ORIGINS
        value: '["http://localhost:5173","https://clauseiq-app.netlify.app"]'
